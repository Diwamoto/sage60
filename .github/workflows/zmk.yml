name: Build ZMK firmware
on:
  push:
    paths: ["firmware/zmk/**", ".github/workflows/zmk.yml"]
  pull_request:
    paths: ["firmware/zmk/**", ".github/workflows/zmk.yml"]
  workflow_dispatch:

# Same steps as zmkfirmware/zmk build-user-config.yml, but that workflow
# expects config/ at the repo root: `west init -l firmware/zmk/config` puts the
# workspace in firmware/zmk while it runs `west update` from the repo root.
env:
  ws: firmware/zmk

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.m.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: echo "build_matrix=$(yq -oj -I0 firmware/zmk/build.yaml)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    name: Build ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    defaults:
      run:
        working-directory: firmware/zmk
    steps:
      - uses: actions/checkout@v7
      - run: west init -l config
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - name: West Build
        run: >
          west build -s zmk/app -d build -b "${{ matrix.board }}"
          ${{ matrix.snippet && format('-S "{0}"', matrix.snippet) || '' }}
          -- -DZMK_CONFIG="$PWD/config" -DSHIELD="${{ matrix.shield }}" ${{ matrix.cmake-args }}
      - run: mkdir out && cp build/zephyr/zmk.uf2 "out/${{ matrix.artifact-name }}.uf2"
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.artifact-name }}
          path: ${{ env.ws }}/out
