# GitHub Actions build matrix (see .github/workflows/zmk.yml).
---
include:
  # Left is the split central; ZMK Studio over USB. No studio-rpc-usb-uart
  # snippet: the shield routes Studio through its own shared serial port
  # (the snippet's chosen would override it), so only its cpp flag is kept.
  - board: xiao_ble//zmk
    shield: sage60_left
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DDTS_EXTRA_CPPFLAGS=-DZMK_BEHAVIORS_KEEP_ALL
    artifact-name: sage60_left
  # Right = mx_right (XIAO nRF52840 Plus + PMW3610).
  - board: xiao_ble//zmk
    shield: sage60_right
    artifact-name: sage60_right
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: sage60_settings_reset

  # ---- EC (Topre-style capacitive) ----
  - board: xiao_ble//zmk
    shield: sage60_ec_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sage60_ec_left
  - board: xiao_ble//zmk
    shield: sage60_ec_right
    artifact-name: sage60_ec_right
  # One-time calibration images (USB serial shell: `ec calibration start` / `save`).
  - board: xiao_ble//zmk
    shield: sage60_ec_left
    snippet: enable_ec_calibrator
    artifact-name: sage60_ec_left_calibrator
  - board: xiao_ble//zmk
    shield: sage60_ec_right
    snippet: enable_ec_calibrator
    artifact-name: sage60_ec_right_calibrator
