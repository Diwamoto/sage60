# Deep sleep after 15 minutes idle to save battery.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Trackball on the right half, forwarded to the left (central) over the split link.
CONFIG_ZMK_POINTING=y

# USB serial for ZMK Studio and the trackball tuning page (case/site/tune.html),
# on the board's CDC ACM port. Console off so that port is free for them.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
